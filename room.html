.origin{border-radius:58% 42% 60% 40% / 48% 58% 42% 52%;overflow:hidden;--art:url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=500&q=92');left:8%;bottom:12%;border:3px solid #86a56c;box-shadow:0 0 0 6px #86a56c18,0 15px 35px #0009}.origin:after{background:linear-gradient(0deg,#173315e5,transparent 72%)}.origin small{color:#cce4ad}

/* unmistakably different portal system */
.portal{background:rgba(3,35,25,.72)!important;backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.38)!important}
.portal:before{opacity:.32!important}
.portal:after{background:linear-gradient(180deg,rgba(0,20,14,.05),rgba(0,20,14,.82))!important}
.portal .icon{position:absolute;z-index:4;left:50%;top:31%;transform:translate(-50%,-50%);font:400 clamp(20px,2vw,32px)/1 Georgia,serif;color:#f2d27d;text-shadow:0 2px 12px #000}
.portal .label{bottom:12px!important}
.cup{border-radius:50%!important}
.craft{border-radius:12px 12px 42px 42px!important}
.menu{border-radius:50%!important;border:3px double #f2d27d!important}
.wall{border-radius:4px!important;transform:rotate(-3deg)}
.origin{border-radius:70% 30% 65% 35%/45% 60% 40% 55%!important}
.table{border-radius:50% 50% 18% 18%!important}
.journey{border-radius:48px 48px 4px 4px!important;border-bottom-width:6px!important}
@media(max-width:700px){.portal .icon{font-size:20px}.portal .label{bottom:8px!important}}
