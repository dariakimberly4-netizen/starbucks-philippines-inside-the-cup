<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Between Sips — Starbucks Philippines</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#03150f;color:#f7f2e9;font-family:Arial,sans-serif}body{overflow-x:hidden}
.scene{height:190vh;position:relative}.frame{position:sticky;top:0;height:100dvh;overflow:hidden;background:#061b14}
.photo{position:absolute;inset:-5%;background:linear-gradient(90deg,#03150fe8 0,#03150f82 42%,transparent 72%),linear-gradient(0deg,#020b08aa,transparent 55%),url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1800&q=88') center/cover;transform:scale(1.06);will-change:transform;filter:saturate(.78) contrast(1.04)}
.warm{position:absolute;inset:0;background:radial-gradient(circle at 68% 55%,#c68a3b22,transparent 32%)}
.brand{position:absolute;z-index:5;top:34px;left:6vw;font-size:11px;font-weight:700;letter-spacing:.24em;line-height:1.55}.mark{font-size:24px;color:#d2aa67;margin-right:10px}
.copy{position:absolute;z-index:5;left:7vw;top:33%;max-width:620px}.eyebrow{font-size:10px;letter-spacing:.38em;color:#d7b276;margin-bottom:20px}.copy h1{font:400 clamp(68px,10vw,142px)/.8 Georgia,serif;letter-spacing:-.06em;margin:0}.copy p{font:italic clamp(18px,2vw,25px)/1.45 Georgia,serif;color:#eee2d1;margin:28px 0 0}
.cue{position:absolute;z-index:5;left:50%;bottom:25px;transform:translateX(-50%);font-size:9px;letter-spacing:.34em;white-space:nowrap}
.ring{position:absolute;z-index:4;right:16%;top:47%;width:24vmin;height:24vmin;border-radius:50%;border:1px solid #f0d4a15c;box-shadow:0 0 0 2vmin #2d160d25,0 0 80px #d3923e33;opacity:.7;will-change:transform}
.bridge{height:180vh;position:relative}.bridge .frame{background:#170a05}.coffee{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 50%,#c8863c 0 2%,#633018 12%,#210d06 39%,#080302 67%);will-change:transform}.reflection{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 42%,#ffe2a51e,transparent 30%);filter:blur(3px)}
.words{position:absolute;z-index:3;inset:0;display:grid;place-items:center;text-align:center;padding:25px}.words small{letter-spacing:.38em;color:#d6ae70}.words h2{font:400 clamp(48px,8vw,105px)/.9 Georgia,serif;margin:20px 0}.words p{font:italic 18px Georgia,serif;color:#decdb8}
.final{height:100dvh;position:relative;display:grid;place-items:center;text-align:center;padding:28px;background:linear-gradient(#061b14d9,#03110cd9),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1800&q=88') center/cover}.final h2{font:400 clamp(50px,8vw,105px)/.92 Georgia,serif;margin:0}.final p{font:italic 19px Georgia,serif;color:#e0d3c2}.line{width:1px;height:60px;background:#cfa966;margin:28px auto}
@media(max-width:600px){.photo{background-position:58% center}.brand{left:24px}.copy{left:25px;top:27%;width:82%}.copy h1{font-size:76px}.copy p{font-size:17px;max-width:270px}.ring{right:14%;top:62%;width:34vmin;height:34vmin}}
</style></head><body>
<section class="scene" id="opening"><div class="frame"><div class="photo"></div><div class="warm"></div><div class="ring"></div><div class="brand"><span class="mark">✳</span>STARBUCKS PHILIPPINES</div><div class="copy"><div class="eyebrow">OUR STORY</div><h1>Between<br>Sips</h1><p>There is more in a cup than coffee.</p></div><div class="cue">SCROLL INTO THE MOMENT ↓</div></div></section>
<section class="bridge" id="bridge"><div class="frame"><div class="coffee"></div><div class="reflection"></div><div class="words"><div><small>LOOK CLOSER</small><h2>Every sip<br>holds a story.</h2><p>Craft. People. Place. Moments shared.</p></div></div></div></section>
<section class="final"><div><div class="eyebrow">BACK AT THE TABLE</div><h2>The cup ends.<br>The story doesn't.</h2><div class="line"></div><p>Our story continues between sips.</p></div></section>
<script>
const a=document.querySelector('#opening'),ph=document.querySelector('.photo'),ring=document.querySelector('.ring'),copy=document.querySelector('.copy'),b=document.querySelector('#bridge'),coffee=document.querySelector('.coffee'),words=document.querySelector('.words');
function clamp(x){return Math.max(0,Math.min(1,x))}
function motion(){let ar=a.getBoundingClientRect(),ap=clamp(-ar.top/(a.offsetHeight-innerHeight));ph.style.transform='scale('+(1.06+ap*.28)+') translateY('+(-ap*2)+'%)';ring.style.transform='scale('+(1+ap*5)+')';ring.style.opacity=1-ap;copy.style.opacity=1-ap*1.6;let br=b.getBoundingClientRect(),bp=clamp(-br.top/(b.offsetHeight-innerHeight));coffee.style.transform='scale('+(1+bp*2.2)+')';words.style.opacity=String(Math.sin(bp*Math.PI)*1.25)}addEventListener('scroll',motion,{passive:true});addEventListener('resize',motion);motion();
</script></body></html>
