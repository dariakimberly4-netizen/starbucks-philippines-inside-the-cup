<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pass the Cup — Starbucks Philippines Story Concept</title><meta name="build" content="pass-the-cup-v2">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#061b14;color:#f7f1e7;font-family:Arial,sans-serif}body{overflow-x:hidden}
.scene{height:180vh;position:relative}.frame{position:sticky;top:0;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 55%,#194b37,#061b14 55%,#02100c)}
.brand{position:absolute;z-index:20;top:38px;left:6vw;font-size:13px;font-weight:700;letter-spacing:.22em;line-height:1.55}.brand i{color:#c99b55;font-style:normal;font-size:28px;margin-right:12px}
.copy{position:absolute;z-index:12;left:7vw;top:29%;max-width:560px}.kicker{font-size:11px;letter-spacing:.36em;color:#d0a867;margin-bottom:18px}.copy h1{font:400 clamp(66px,9vw,132px)/.82 Georgia,serif;letter-spacing:-.055em;margin:0}.copy p{font:italic 21px/1.5 Georgia,serif;color:#e9dfd1;margin:24px 0 0}
.table{position:absolute;left:-10%;right:-10%;bottom:-8%;height:31%;background:linear-gradient(10deg,#351d11,#71472b 42%,#2d180f);transform:perspective(700px) rotateX(61deg);transform-origin:bottom;box-shadow:0 -35px 90px #0009}
.cup{position:absolute;z-index:7;left:61%;top:43%;width:190px;height:245px;border-radius:10px 10px 56px 56px;background:linear-gradient(100deg,#eee7da,#fff 45%,#c9c0b2);box-shadow:0 35px 45px #0008;transform:translate(-50%,-50%);will-change:transform}
.cup:before{content:"";position:absolute;left:12px;right:12px;top:-13px;height:31px;border-radius:50%;background:radial-gradient(ellipse,#4b1d0d 0 55%,#d6cdbf 58% 72%,#fff 74%)}.cup:after{content:"";position:absolute;width:72px;height:72px;border:3px solid #0b6b4b;border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%);opacity:.75}
.steam{position:absolute;z-index:6;left:61%;top:22%;width:90px;height:180px;border-left:8px solid #fff3df35;border-radius:50%;filter:blur(7px);animation:steam 4s ease-in-out infinite}
.hand{position:absolute;z-index:8;right:-22%;top:47%;width:46%;height:110px;border-radius:80px 0 0 80px;background:linear-gradient(100deg,#9d6549,#d99c78);transform:rotate(-8deg);box-shadow:0 18px 45px #0006}
.prompt{position:absolute;z-index:20;bottom:28px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.34em;white-space:nowrap;color:#e1c99f}
.transition{height:130vh;position:relative;background:#1b0c07}.transition .frame{background:radial-gradient(circle,#6d3419,#1a0b07 58%,#050201)}
.ripple{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;border:2px solid #d49b5d55;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 7vmin #c9894930,0 0 0 14vmin #a9612920,0 0 100px #e5a45833}
.centerword{position:absolute;z-index:4;inset:0;display:grid;place-items:center;text-align:center}.centerword h2{font:400 clamp(50px,8vw,110px)/.9 Georgia,serif;margin:0}.centerword small{display:block;margin-bottom:18px;letter-spacing:.34em;color:#d4a462}
.end{height:100dvh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,#174a35,#03140e 65%);padding:30px}.end h2{font:400 clamp(48px,8vw,100px)/.95 Georgia,serif;margin:0}.end p{font:italic 20px Georgia,serif;color:#ddcfbd}.pass{margin-top:35px;border:1px solid #c99b55;padding:16px 24px;display:inline-block;font-size:11px;letter-spacing:.3em}
@keyframes steam{50%{transform:translateY(-28px) rotate(10deg);opacity:.35}}
@media(max-width:600px){.brand{left:25px;top:32px}.copy{left:26px;top:22%;width:78%}.copy h1{font-size:72px}.copy p{font-size:17px}.cup{left:61%;top:59%;width:145px;height:190px}.steam{left:61%;top:39%;height:145px}.hand{top:61%;right:-38%;width:70%;height:90px}.table{height:28%}}
</style></head><body>
<section class="scene" id="pass"><div class="frame"><div class="brand"><i>✳</i> STARBUCKS<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;PHILIPPINES</div><div class="copy"><div class="kicker">OUR STORY · PASS THE CUP</div><h1>One<br>Cup.</h1><p>A story carried from one hand to the next.</p></div><div class="steam"></div><div class="cup"></div><div class="hand"></div><div class="table"></div><div class="prompt">SCROLL · PASS IT ON ↓</div></div></section>
<section class="transition"><div class="frame"><div class="ripple"></div><div class="centerword"><div><small>THE CUP KEEPS MOVING</small><h2>Craft becomes<br>connection.</h2></div></div></div></section>
<section class="end"><div><h2>Every cup<br>continues the story.</h2><p>From craft, to people, to the moments shared around a table.</p><div class="pass">PASS IT ON →</div></div></section>
<script>
const s=document.querySelector('#pass'),cup=document.querySelector('.cup'),hand=document.querySelector('.hand'),steam=document.querySelector('.steam'),copy=document.querySelector('.copy');
function move(){let r=s.getBoundingClientRect(),m=s.offsetHeight-innerHeight,p=Math.max(0,Math.min(1,-r.top/m));cup.style.transform='translate(-50%,-50%) translateX('+(-p*62)+'vw) rotate('+(-p*9)+'deg) scale('+(1+p*.22)+')';hand.style.transform='translateX('+(-p*48)+'vw) rotate(-8deg)';steam.style.opacity=1-p;copy.style.opacity=1-p*1.7}addEventListener('scroll',move,{passive:true});addEventListener('resize',move);move();
</script></body></html>
