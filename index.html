ition:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:#c9bba8;text-align:center;animation:pulse 2s ease-in-out infinite}.cue:after{content:"↓";display:block;font-size:18px;margin-top:8px;color:#c79a5a}.pour{min-height:100dvh;padding:16vh 8vw;background:linear-gradient(#00120d,#071c15 45%,#1e130e);display:grid;place-items:center;text-align:center}.pour small{letter-spacing:4px;color:#c79a5a}.pour h2{font:400 clamp(45px,11vw,100px)/1 Georgia,serif;margin:18px 0}.pour p{max-width:620px;color:#d9d1c7;line-height:1.7}.drop{width:3px;height:130px;background:linear-gradient(transparent,#b8783f,#3a1d0e);margin:45px auto;border-radius:50%;animation:pour 1.8s ease-in-out infinite}.next{display:inline-block;margin-top:24px;color:#f5eee3;text-decoration:none;border-bottom:1px solid #c79a5a;padding:10px 0;font-size:11px;letter-spacing:2px}
